[package]
name = "family-tree"
version = "0.1.0"
edition = "2021"

[lib]
name = "family_tree"
path = "src/lib.rs"

[dependencies]
annotate-snippets = "0.11.5"
anyhow = "1.0.86"
base64 = "0.22.1"
erased-serde = "0.4.5"
itertools = "0.13.0"
lazy_static = "1.5.0"
octocrab = "0.40.0"
regex = "1.10.6"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
structopt = "0.3.26"
thiserror = "1.0.63"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
expect-test = "1.5"
