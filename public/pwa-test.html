<!DOCTYPE html>
<html>
<head>
    <title>PWA Test - Family Tree</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; }
        .test-results { margin-top: 20px; }
        .cache-item { margin: 5px 0; padding: 5px; background: #f8f9fa; }
    </style>
</head>
<body>
    <h1>🇬🇷 Family Tree PWA - Greece Travel Test</h1>
    
    <div id="status"></div>
    
    <h2>Service Worker Status</h2>
    <div id="sw-status"></div>
    
    <h2>Cache Test</h2>
    <button onclick="testCache()">Test Cache</button>
    <button onclick="clearCache()">Clear Cache</button>
    <button onclick="preloadForGreece()">🇬🇷 Preload for Greece</button>
    
    <h2>Offline Test</h2>
    <button onclick="testOffline()">Test Offline Mode</button>
    <div id="offline-status"></div>
    
    <h2>Cached Resources</h2>
    <div id="cache-contents"></div>
    
    <script>
        function addStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            document.getElementById('status').appendChild(div);
        }
        
        function updateSwStatus() {
            const statusDiv = document.getElementById('sw-status');
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    if (registrations.length > 0) {
                        const reg = registrations[0];
                        let status = '✅ Service Worker registered<br>';
                        status += `Scope: ${reg.scope}<br>`;
                        
                        if (reg.active) {
                            status += `State: ${reg.active.state}<br>`;
                        }
                        
                        statusDiv.innerHTML = `<div class="status success">${status}</div>`;
                    } else {
                        statusDiv.innerHTML = '<div class="status error">❌ No service worker found</div>';
                    }
                });
            } else {
                statusDiv.innerHTML = '<div class="status error">❌ Service Worker not supported</div>';
            }
        }
        
        async function testCache() {
            addStatus('🔍 Testing cache functionality...');
            
            try {
                const cacheNames = await caches.keys();
                addStatus(`📦 Found ${cacheNames.length} cache(s): ${cacheNames.join(', ')}`, 'success');
                
                // Test if family data is cached
                const cache = await caches.open('family-tree-v1');
                const keys = await cache.keys();
                
                const familyDataUrls = keys.filter(req => 
                    req.url.includes('/api/v1/') || req.url.endsWith('.json')
                );
                
                if (familyDataUrls.length > 0) {
                    addStatus(`🇬🇷 PERFECT! ${familyDataUrls.length} family data files cached for Greece!`, 'success');
                    familyDataUrls.forEach(req => {
                        addStatus(`✅ Cached: ${new URL(req.url).pathname}`, 'info');
                    });
                } else {
                    addStatus('⚠️ No family data cached yet. Visit the main app first.', 'error');
                    addStatus(`Cache contains ${keys.length} items but no family data`, 'info');
                }
                
                showCacheContents();
                
            } catch (error) {
                addStatus(`❌ Cache test failed: ${error.message}`, 'error');
            }
        }
        
        async function showCacheContents() {
            const div = document.getElementById('cache-contents');
            
            try {
                const cacheNames = await caches.keys();
                let html = '';
                
                for (const cacheName of cacheNames) {
                    const cache = await caches.open(cacheName);
                    const keys = await cache.keys();
                    
                    html += `<h3>${cacheName} (${keys.length} items)</h3>`;
                    keys.forEach(request => {
                        const url = new URL(request.url);
                        html += `<div class="cache-item">${url.pathname}</div>`;
                    });
                }
                
                div.innerHTML = html;
            } catch (error) {
                div.innerHTML = `<div class="status error">❌ Error reading cache: ${error.message}</div>`;
            }
        }
        
        async function clearCache() {
            try {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(name => caches.delete(name)));
                addStatus('🗑️ All caches cleared', 'success');
                showCacheContents();
            } catch (error) {
                addStatus(`❌ Clear cache failed: ${error.message}`, 'error');
            }
        }
        
        async function preloadForGreece() {
            addStatus('🇬🇷 Preloading family data for Greece travel...');
            
            const urlsToPreload = [
                '/',
                '/api/v1/people.json',
                '/api/v1/partnerships.json',
                '/assets/vendor.js',
                '/assets/family-tree.js',
                '/assets/vendor.css',
                '/assets/family-tree.css'
            ];
            
            let successCount = 0;
            
            for (const url of urlsToPreload) {
                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        successCount++;
                        addStatus(`✅ Cached: ${url}`, 'success');
                    } else {
                        addStatus(`⚠️ Failed to cache: ${url} (${response.status})`, 'error');
                    }
                } catch (error) {
                    addStatus(`❌ Error caching ${url}: ${error.message}`, 'error');
                }
            }
            
            addStatus(`🎯 Greece prep complete! ${successCount}/${urlsToPreload.length} resources cached`, 'success');
            showCacheContents();
        }
        
        async function testOffline() {
            const div = document.getElementById('offline-status');
            div.innerHTML = '<div class="status info">🔍 Testing offline functionality...</div>';
            
            // Test if cached resources are available
            try {
                // Find the correct cache name
                const cacheNames = await caches.keys();
                const familyCache = cacheNames.find(name => name.includes('family-tree')) || 'family-tree-v1';
                
                const cache = await caches.open(familyCache);
                const response = await cache.match('/api/v1/people.json');
                
                if (response) {
                    const data = await response.json();
                    div.innerHTML = `
                        <div class="status success">
                            ✅ Offline test passed!<br>
                            📱 Found ${Object.keys(data).length} people in cache<br>
                            🇬🇷 Ready for Greece travel!
                        </div>
                    `;
                } else {
                    // Check if the data might be cached with full URL
                    const keys = await cache.keys();
                    const peopleUrl = keys.find(req => req.url.includes('/api/v1/people.json'));
                    
                    if (peopleUrl) {
                        const fullResponse = await cache.match(peopleUrl);
                        const data = await fullResponse.json();
                        div.innerHTML = `
                            <div class="status success">
                                ✅ Offline test passed!<br>
                                📱 Found ${Object.keys(data).length} people in cache<br>
                                🇬🇷 Ready for Greece travel!
                            </div>
                        `;
                    } else {
                        div.innerHTML = '<div class="status error">❌ No family data available offline. Visit the main app first to cache data.</div>';
                    }
                }
            } catch (error) {
                div.innerHTML = `<div class="status error">❌ Offline test failed: ${error.message}</div>`;
            }
        }
        
        // Initialize
        updateSwStatus();
        showCacheContents();
        
        // Auto-refresh SW status
        setInterval(updateSwStatus, 5000);
        
        addStatus('🚀 PWA Test Interface Ready');
        addStatus('ℹ️ This tests your Family Tree PWA for Greece travel readiness');
    </script>
</body>
</html>
